const styles = {}; SONGS.forEach(s => (s.s || "").split("/").map(x => x.trim().replace(/\s*\(.*\)/, "")).filter(Boolean).forEach(x => { x = x[0].toUpperCase() + x.slice(1); styles[x] = (styles[x] || 0) + 1; }));
document.getElementById("style").insertAdjacentHTML("beforeend", Object.keys(styles).sort((a, b) => styles[b] - styles[a]).map(x => `<option>${esc(x)}</option>`).join(""));
const grow = t => { t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight + 2, 300) + "px"; };
let only = false;
function filter() {
  const q = document.getElementById("q").value.trim().toLowerCase(), sty = document.getElementById("style").value.toLowerCase();
  let n = 0, picks = 0;
  document.querySelectorAll("tr[data-id]").forEach(tr => { const s = SONGS.find(x => x.id === tr.dataset.id), pk = tr.classList.contains("picked"); if (pk) picks++;
    const show = (!q || (s.t + " " + s.a + " " + s.v).toLowerCase().includes(q)) && (!sty || (s.s || "").toLowerCase().includes(sty)) && (!only || pk);
    tr.hidden = !show; if (show) n++; });
  document.getElementById("count").textContent = `${n} morceaux · ${picks} ★`;
}
function fill() {
  const g = document.getElementById("general");
  if (document.activeElement !== g && pending["_general|note"] === undefined) { g.value = state.general || ""; grow(g); }
  g.parentElement.classList.toggle("has", !!g.value);
  document.querySelectorAll("tr[data-id]").forEach(tr => {
    const d = state.songs[tr.dataset.id] || {};
    tr.classList.toggle("picked", !!d.pick); tr.querySelector(".star button").setAttribute("aria-pressed", !!d.pick);
    tr.querySelectorAll("[data-f]").forEach(el => {
      const f = el.dataset.f;
      if (document.activeElement === el || pending[tr.dataset.id + "|" + f] !== undefined) return;
      if (el.type === "checkbox") el.checked = !!d[f]; else el.value = d[f] || "";
      if (el.tagName === "TEXTAREA") grow(el);
    });
  });
  filter();
}
function setLocal(id, f, v) { if (id === "_general") { state.general = v; return; } state.songs[id] = state.songs[id] || {}; state.songs[id][f] = v; }
function merge(data) { if (data && data.songs) { state.songs = data.songs; state.general = data.general || ""; } for (const key in pending) { const [id, f] = key.split("|"); setLocal(id, f, pending[key]); } }
const timers = {}; let busy = false;
function queue(id, f, v, ms) { setLocal(id, f, v); pending[id + "|" + f] = v; save(); setStatus("Enregistrement…"); clearTimeout(timers[id + f]); timers[id + f] = setTimeout(flush, ms); }
async function flush() {
  if (busy) return; busy = true;
  try {
    for (const key of Object.keys(pending)) {
      const [id, f] = key.split("|"), v = pending[key];
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id, field: f, value: v }) });
      if (!r.ok) throw 0;
      const data = await r.json(); if (pending[key] === v) delete pending[key]; merge(data);
    }
    save(); setStatus("Enregistré ✓", "ok");
  } catch (e) { save(); setStatus("Gardé sur cet appareil, pas encore en ligne", "err"); } finally { busy = false; }
}
async function pull() {
  try { const r = await fetch(API, { cache: "no-store" }); if (!r.ok) throw 0; merge(await r.json()); save(); fill();
    if (Object.keys(pending).length) flush(); else setStatus("Enregistré ✓", "ok");
  } catch (e) { fill(); setStatus("Hors ligne : gardé sur cet appareil", "err"); }
}
document.addEventListener("input", e => { const el = e.target;
  if (el.id === "general") { grow(el); el.parentElement.classList.toggle("has", !!el.value); return queue("_general", "note", el.value, 900); }
  if (el.id === "q") return filter();
  const tr = el.closest("tr[data-id]"); if (!tr || !el.dataset.f || el.type === "checkbox") return;
  if (el.tagName === "TEXTAREA") grow(el); queue(tr.dataset.id, el.dataset.f, el.value, 800); });
document.getElementById("style").addEventListener("change", filter);
document.addEventListener("click", e => {
  const b = e.target.closest(".star button");
  if (b) { const tr = b.closest("tr"), v = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", v); tr.classList.toggle("picked", v); queue(tr.dataset.id, "pick", v, 50); return filter(); }
  if (e.target.closest("#only")) { only = !only; document.getElementById("only").setAttribute("aria-pressed", only); filter(); } });
document.addEventListener("change", e => { const el = e.target, tr = el.closest("tr[data-id]"); if (!tr || el.type !== "checkbox") return; queue(tr.dataset.id, "known", el.checked, 50); });
window.addEventListener("online", flush);
setInterval(() => Object.keys(pending).length ? flush() : pull(), 30000);
fill(); pull();
</script>
</body>
</html>
